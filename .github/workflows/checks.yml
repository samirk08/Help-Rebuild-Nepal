name: Checks

# Why this exists: the Vercel checks on a pull request only prove the Next.js
# app builds. They do not run `npm test`, so a pull request could be green with
# a test file that does not even compile — which is exactly what happened on
# two of the automated pull requests this workflow was added alongside.
#
# Typecheck, tests and build, on every pull request and every push to main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Compiles tests/ and runs node --test. Needs no Supabase project and
      # sends no mail: the rules are tested against fakes, and the guarantees
      # that belong to the database run against PGlite in-process.
      - name: Tests
        run: npm test

      # Placeholder values. `next build` reads these at module scope in a few
      # places; nothing here contacts Supabase, and no real credential belongs
      # in a workflow file that runs on pull requests from forks.
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # Loads every public page against the build that was just produced.
      # `next build` proves the bundle exists and a unit test proves a function
      # is right; neither one renders a page, so a server component that throws
      # on a null read is invisible to both.
      #
      # Not end-to-end: the credentials are placeholders, so nothing here shows
      # a form saving. It shows that every page degrades rather than breaks with
      # the database unreachable — which is what a misconfigured deployment
      # actually looks like. A real end-to-end run belongs in the staging pilot
      # (docs/RELEASE.md).
      - name: Smoke test
        run: |
          npm run start &
          # Polled with curl rather than a helper package: fetching a
          # dependency mid-job to wait for a port is a second thing that can
          # fail, and it would fail as "smoke test broken".
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/en && break
            sleep 1
          done
          node scripts/smoke.mjs
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
