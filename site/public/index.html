<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help Rebuild Nepal</title>
    <!--
      Every page on this site lives under a language segment. A server build
      redirects the bare root in `next.config.ts`; a static host cannot, so
      this page stands in for that redirect.

      The target is relative, so it resolves correctly whether the site is
      served from a domain root or from a repository subpath.
    -->
    <meta http-equiv="refresh" content="0; url=./en/" />
    <link rel="canonical" href="./en/" />
    <script>
      // Replace rather than assign, so the back button leaves the site
      // instead of bouncing off this page.
      window.location.replace("./en/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./en/">Help Rebuild Nepal</a>.</p>
  </body>
</html>
